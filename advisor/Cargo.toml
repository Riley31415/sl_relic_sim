[package]
name = "relic-advisor"
version = "0.1.0"
edition = "2024"
description = "Reads a Hero's Legacy screenshot and says what the look-ahead plan does next"

[[bin]]
name = "relic-advisor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
relic = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

# not a member of the main crate's (absent) workspace: builds on its own
[workspace]
